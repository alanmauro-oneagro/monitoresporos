{% extends "base.html" %}
{% block title %}Entrar - OneAgro{% endblock %}
{% block extra_head %}
<style>
    body {
        /* Foto vertical (celular) por padrao -- a foto larga (paisagem)
           so entra a partir do breakpoint de desktop, senao o
           background-size:cover corta as laterais numa tela alta e
           estreita e a estacao (o assunto da foto) pode sair do quadro. */
        background-image: linear-gradient(rgba(10, 31, 68, 0.25), rgba(10, 31, 68, 0.25)), url("{{ url_for('static', filename='login-bg-mobile.jpg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
    }
    @media (min-width: 768px) {
        body {
            background-image: linear-gradient(rgba(10, 31, 68, 0.25), rgba(10, 31, 68, 0.25)), url("{{ url_for('static', filename='login-bg-desktop.jpg') }}");
            /* A estacao fica mais pra direita na foto -- desloca o
               enquadramento nessa direcao (em vez de centralizado) pra
               ela ficar mais visivel, em vez de cortada/apertada. */
            background-position: 75% center;
        }
    }
</style>
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-sm-8 col-md-5">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h4 class="mb-3">Entrar</h4>
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
