{% extends "base.html" %}
{% block title %}Definir nova senha - OneAgro{% endblock %}
{% block content %}
<h4 class="mb-3">Definir nova senha</h4>
<div class="alert alert-info small">
    Voce entrou com uma senha temporaria -- defina uma senha definitiva
    pra continuar usando o sistema.
</div>

<div class="card shadow-sm" style="max-width: 420px;">
    <div class="card-body">
        <form method="post">
            <div class="mb-2">
                <label class="form-label">Nova senha</label>
                <input type="password" name="senha_nova" class="form-control" minlength="6" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar nova senha</label>
                <input type="password" name="senha_confirmar" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-success">Salvar nova senha</button>
        </form>
    </div>
</div>
{% endblock %}
