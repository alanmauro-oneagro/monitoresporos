{% extends "base.html" %}
{% block title %}Editar cadastro - OneAgro{% endblock %}
{% block content %}
<h4 class="mb-3">Editar cadastro de "{{ user.username }}"</h4>

<div class="card shadow-sm" style="max-width: 420px;">
    <div class="card-body">
        <form method="post" data-autosave>
            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ email }}" required>
            </div>
            <div class="mb-3 row g-2">
                <div class="col-3 col-sm-2">
                    <label class="form-label text-nowrap">DDI</label>
                    <input type="text" name="codigo_pais" class="form-control bg-light" value="55" readonly>
                </div>
                <div class="col-9 col-sm-10">
                    <label class="form-label">Telefone (DDD + numero, sem espacos)</label>
                    <input type="text" name="numero_telefone" class="form-control" value="{{ numero_telefone }}" placeholder="11999999999" required>
                </div>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" name="is_admin" id="edit_is_admin" {% if is_admin %}checked{% endif %}>
                <label class="form-check-label" for="edit_is_admin">
                    Administrador -- marcado = <strong>Adm</strong> (acesso a tudo);
                    desmarcado = <strong>Usuario</strong> (so as fazendas liberadas)
                </label>
            </div>
            <button type="submit" name="action" value="test" class="btn btn-success">Enviar teste por WhatsApp</button>
            <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">Voltar</a>
            <span class="autosave-status small ms-2"></span>
        </form>
    </div>
</div>
{% endblock %}
