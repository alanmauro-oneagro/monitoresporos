{% extends "base.html" %}
{% block title %}Editar cadastro - OneAgro{% endblock %}
{% block content %}
<h4 class="mb-3">Editar cadastro de "{{ user.username }}"</h4>

<div class="card shadow-sm" style="max-width: 420px;">
    <div class="card-body">
        <form method="post">
            <div class="mb-2">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ email }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Telefone (com codigo do pais, sem + nem espacos)</label>
                <input type="text" name="telefone" class="form-control" value="{{ telefone }}" placeholder="5511999999999" required>
            </div>
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
