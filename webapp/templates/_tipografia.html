{# Tipografia padrao do site e do app (pedido do Alan, 08/11/2026): um
   tamanho so' pra titulo de pagina, um pra subtitulo de secao e um pro
   conteudo -- em vez de cada tela usar h1/h2/h4/h5/h6 do Bootstrap com
   tamanhos diferentes. #}
<style>
    :root { --fonte-titulo: 1.25rem; --fonte-subtitulo: 1rem; --fonte-conteudo: 0.95rem; }
    body { font-size: var(--fonte-conteudo); }
    h1, h2, h3, h4, .h1, .h2, .h3, .h4, h1.titulo { font-size: var(--fonte-titulo); font-weight: 700; line-height: 1.3; }
    h5, h6, .h5, .h6 { font-size: var(--fonte-subtitulo); font-weight: 600; line-height: 1.3; }
    .form-control, .form-select, .btn, .input-group-text, .dropdown-item, .list-group-item, .table { font-size: var(--fonte-conteudo); }
    .form-control-sm, .form-select-sm, .btn-sm, .input-group-sm > .form-control, .input-group-sm > .btn,
    .input-group-sm > .input-group-text, .table-sm { font-size: 0.85rem; }
    .small, small { font-size: 0.85em; }
</style>
