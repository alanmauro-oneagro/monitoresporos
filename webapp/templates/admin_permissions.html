{% extends "base.html" %}
{% block title %}Permissoes - OneAgro{% endblock %}
{% block content %}
<h4 class="mb-3">Fazendas liberadas para "{{ user.username }}"</h4>

<form method="post">
    <div class="card shadow-sm" style="max-width: 480px;">
        <div class="card-body">
            <div class="form-check border-bottom pb-2 mb-2">
                <input class="form-check-input" type="checkbox" id="selectAllPermissionSites">
                <label class="form-check-label fw-bold" for="selectAllPermissionSites">Marcar todas</label>
            </div>
            {% for site in sites %}
            <div class="form-check">
                <input class="form-check-input permission-site-checkbox" type="checkbox" name="site_ids" value="{{ site.id }}"
                    id="site{{ site.id }}" {% if site.id in permitted_ids %}checked{% endif %}>
                <label class="form-check-label" for="site{{ site.id }}">{{ site.site_name }}</label>
            </div>
            {% endfor %}
        </div>
    </div>
    <button type="submit" class="btn btn-success mt-3">Salvar permissoes</button>
    <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary mt-3">Cancelar</a>
</form>
<script>
var selectAll = document.getElementById('selectAllPermissionSites');
var siteCheckboxes = document.querySelectorAll('.permission-site-checkbox');
function syncSelectAll() {
    selectAll.checked = Array.from(siteCheckboxes).every(function (c) { return c.checked; });
}
selectAll.addEventListener('change', function () {
    siteCheckboxes.forEach(function (cb) { cb.checked = selectAll.checked; });
});
siteCheckboxes.forEach(function (cb) { cb.addEventListener('change', syncSelectAll); });
syncSelectAll();
</script>
{% endblock %}
