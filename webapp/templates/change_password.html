{% extends "base.html" %}
{% block title %}Trocar senha - OneAgro{% endblock %}
{% block content %}
<h4 class="mb-3">Trocar senha</h4>

<div class="card shadow-sm" style="max-width: 420px;">
    <div class="card-body">
        <form method="post">
            <div class="mb-2">
                <label class="form-label">Senha atual</label>
                <input type="password" name="senha_atual" class="form-control" required autofocus>
            </div>
            <div class="mb-2">
                <label class="form-label">Nova senha</label>
                <input type="password" name="senha_nova" class="form-control" minlength="6" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Confirmar nova senha</label>
                <input type="password" name="senha_confirmar" class="form-control" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-success">Salvar nova senha</button>
        </form>
    </div>
</div>
{% endblock %}
